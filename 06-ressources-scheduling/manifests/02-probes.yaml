apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
  namespace: lab-ressources
spec:
  containers:
    - name: app
      image: busybox:1.36
      # sain 20 s puis le fichier disparaît -> liveness échoue -> restart
      command: ["sh", "-c", "touch /tmp/healthy; sleep 20; rm -f /tmp/healthy; sleep 600"]
      livenessProbe:
        exec: {command: ["cat", "/tmp/healthy"]}
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: readiness-demo
  namespace: lab-ressources
  labels: {app: ready}
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      startupProbe:
        httpGet: {path: /, port: 80}
        failureThreshold: 30
        periodSeconds: 2
      readinessProbe:
        httpGet: {path: /ready, port: 80}      # 404 -> jamais Ready (Lab 6.3)
        periodSeconds: 3
      livenessProbe:
        httpGet: {path: /, port: 80}
        periodSeconds: 10
