apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: lab-quota
spec:
  hard:
    pods: "5"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: lab-quota
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: 200m, memory: 256Mi}
      max: {cpu: "1", memory: 512Mi}
