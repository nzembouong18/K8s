apiVersion: v1
kind: ServiceAccount
metadata:
  name: lecteur
  namespace: lab-secu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: lab-secu
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lecteur-pods
  namespace: lab-secu
subjects:
  - kind: ServiceAccount
    name: lecteur
    namespace: lab-secu
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
