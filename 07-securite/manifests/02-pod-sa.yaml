apiVersion: v1
kind: Pod
metadata:
  name: api-client
  namespace: lab-secu
spec:
  serviceAccountName: lecteur
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sh", "-c"]
      args:
        - |
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          TOKEN=$(cat $SA/token)
          for r in pods secrets; do
            echo "== $r =="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" --cacert $SA/ca.crt \
              -H "Authorization: Bearer $TOKEN" \
              https://kubernetes.default.svc/api/v1/namespaces/lab-secu/$r
          done
