# 5 applications, 5 défauts différents. Objectif : tout remettre au vert.
apiVersion: v1
kind: Namespace
metadata: {name: lab-pannes}
---
# app1
apiVersion: apps/v1
kind: Deployment
metadata: {name: app1, namespace: lab-pannes}
spec:
  replicas: 1
  selector: {matchLabels: {app: app1}}
  template:
    metadata: {labels: {app: app1}}
    spec:
      containers:
        - {name: c, image: "nginx:1.27.99"}
---
# app2
apiVersion: apps/v1
kind: Deployment
metadata: {name: app2, namespace: lab-pannes}
spec:
  replicas: 1
  selector: {matchLabels: {app: app2}}
  template:
    metadata: {labels: {app: app2}}
    spec:
      containers:
        - name: c
          image: nginx:1.27
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef: {name: app2-secret, key: token}
---
# app3
apiVersion: apps/v1
kind: Deployment
metadata: {name: app3, namespace: lab-pannes}
spec:
  replicas: 2
  selector: {matchLabels: {app: app3}}
  template:
    metadata: {labels: {app: app3}}
    spec:
      containers:
        - {name: c, image: "nginx:1.27"}
---
apiVersion: v1
kind: Service
metadata: {name: app3, namespace: lab-pannes}
spec:
  selector: {app: app-3}
  ports:
    - {port: 80}
---
# app4
apiVersion: apps/v1
kind: Deployment
metadata: {name: app4, namespace: lab-pannes}
spec:
  replicas: 1
  selector: {matchLabels: {app: app4}}
  template:
    metadata: {labels: {app: app4}}
    spec:
      containers:
        - name: c
          image: nginx:1.27
          readinessProbe:
            httpGet: {path: /health, port: 80}
---
# app5
apiVersion: apps/v1
kind: Deployment
metadata: {name: app5, namespace: lab-pannes}
spec:
  replicas: 1
  selector: {matchLabels: {app: app5}}
  template:
    metadata: {labels: {app: app5}}
    spec:
      nodeSelector: {gpu: "true"}
      containers:
        - {name: c, image: "nginx:1.27"}
