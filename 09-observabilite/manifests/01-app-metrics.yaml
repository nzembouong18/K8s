apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: lab-obs
spec:
  replicas: 2
  selector:
    matchLabels: {app: demo-app}
  template:
    metadata:
      labels: {app: demo-app}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - {name: http, containerPort: 80}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 64Mi}
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args: ["--nginx.scrape-uri=http://localhost:8080/stub_status"]
          ports:
            - {name: metrics, containerPort: 9113}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
      # stub_status exposé sur 8080 via ConfigMap
      volumes:
        - name: conf
          configMap: {name: demo-app-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: lab-obs
  labels: {app: demo-app}
spec:
  selector: {app: demo-app}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: metrics, port: 9113, targetPort: metrics}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-nginx
  namespace: lab-obs
data:
  default.conf: |
    server {
      listen 80;
      location / { root /usr/share/nginx/html; index index.html; }
    }
    server {
      listen 8080;
      location /stub_status { stub_status; allow 127.0.0.1; deny all; }
    }
