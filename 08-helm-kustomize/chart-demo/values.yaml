replicaCount: 2

image:
  repository: nginx
  tag: ""            # défaut : appVersion
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: webapp.local

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

env: {}

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi
