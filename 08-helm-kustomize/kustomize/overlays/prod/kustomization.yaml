apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-prod
namePrefix: prod-
resources:
  - ../../base
images:
  - name: nginx
    newTag: "1.27"
replicas:
  - name: webapp
    count: 4
configMapGenerator:
  - name: webapp-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=warn
patches:
  - target:
      kind: Deployment
      name: webapp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
