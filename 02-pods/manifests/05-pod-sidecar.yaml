apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
  namespace: lab-pods
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date) requête traitée\" >> /var/log/app.log; sleep 2; done"]
      volumeMounts:
        - {name: logs, mountPath: /var/log}
    - name: log-reader
      image: busybox:1.36
      command: ["sh", "-c", "touch /var/log/app.log; tail -F /var/log/app.log"]
      volumeMounts:
        - {name: logs, mountPath: /var/log}
  volumes:
    - name: logs
      emptyDir: {}
