apiVersion: v1
kind: Pod
metadata: {name: casse-image, namespace: lab-pods}
spec:
  containers:
    - {name: c, image: "nginx:1.99.99"}
---
apiVersion: v1
kind: Pod
metadata: {name: casse-cmd, namespace: lab-pods}
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "exit 1"]
---
apiVersion: v1
kind: Pod
metadata: {name: casse-pending, namespace: lab-pods}
spec:
  containers:
    - name: c
      image: nginx:1.27
      resources:
        requests: {cpu: "100"}
