# Lab 2.6 : le même programme, avec et sans gestion de SIGTERM
apiVersion: v1
kind: Pod
metadata: {name: avec-trap, namespace: lab-pods}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      # sleep en arrière-plan + wait : le shell (PID 1) peut recevoir le signal et réagir
      args: ["trap 'echo arrêt propre; exit 0' TERM; sleep 3600 & wait"]
---
apiVersion: v1
kind: Pod
metadata: {name: sans-trap, namespace: lab-pods}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]       # PID 1 sans handler : SIGTERM ignoré -> SIGKILL après 30 s
