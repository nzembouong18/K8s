apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  namespace: lab-pods
spec:
  initContainers:
    - name: prepare
      image: busybox:1.36
      command: ["sh", "-c", "echo \"<h1>Prêt à $(date)</h1>\" > /work/index.html"]
      volumeMounts:
        - {name: html, mountPath: /work}
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      volumeMounts:
        - {name: html, mountPath: /usr/share/nginx/html}
  volumes:
    - name: html
      emptyDir: {}
