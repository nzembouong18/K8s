apiVersion: batch/v1
kind: Job
metadata:
  name: calcul-pi
  namespace: lab-workloads
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pi
          image: perl:5.40
          command: ["perl", "-Mbignum=bpi", "-wle", "print bpi(200)"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: parallele
  namespace: lab-workloads
spec:
  completions: 6
  parallelism: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep 5; echo terminé par $(hostname)"]
