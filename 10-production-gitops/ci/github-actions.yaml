# À copier dans .github/workflows/ci.yaml du dépôt applicatif
name: ci
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Scan Trivy (échec si CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
      - name: Push
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Mettre à jour le dépôt GitOps
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/ORG/gitops-repo.git
          cd gitops-repo
          git checkout -b bump-${{ github.sha }}
          sed -i "s#image: ghcr.io/${{ github.repository }}:.*#image: ghcr.io/${{ github.repository }}:${{ github.sha }}#" apps/myapp/deployment.yaml
          git commit -am "chore: bump myapp to ${{ github.sha }}"
          git push origin HEAD
          gh pr create --title "Deploy ${{ github.sha }}" --body "Mise à jour automatique" 
