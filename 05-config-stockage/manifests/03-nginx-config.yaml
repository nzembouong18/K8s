apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: lab-config
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 "bonjour config\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-conf
  namespace: lab-config
spec:
  replicas: 1
  selector:
    matchLabels: {app: nginx-conf}
  template:
    metadata:
      labels: {app: nginx-conf}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
